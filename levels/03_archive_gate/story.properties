# Story1：档案门调查篇章。编码 UTF-8，加载时用 Properties.load(Reader, UTF_8)。
# 人物、残页与对白均为本项目原创，口径见 docs/WORLD_BIBLE.md。候选残页的预测由 candidates/*.dig
# 交给 Digital 仿真得出，不在界面里另写逻辑表达式；排除只依据玩家亲眼观察到的旧门回应。
# 本文件与 level.properties / reference / tests 分开，不参与旧进度指纹，旧存档继续可用。
schemaVersion=1

# 三张互不等价的候选残页（前台只用自然语言与原创符文名）。
# origin / doubt 是每页的来历与疑点：分量相当，不能靠来历猜出答案，只能靠门前证据。
candidates=any,both,single
candidate.any.name=残页甲 · 任一印
candidate.any.rule=只要有一份报告成立，门就开启。
candidate.any.origin=夹在水浸的《门规》册里，字迹最完整。
candidate.any.doubt=纸比册子新，像是后来补抄的。
candidate.any.model=candidates/any.dig
candidate.both.name=残页乙 · 双印
candidate.both.rule=两份报告都成立，门才开启。
candidate.both.origin=粘在门框背面，墨迹晕开了一半。
candidate.both.doubt=「都」字晕得厉害，也可能是「有」字。
candidate.both.model=candidates/both.dig
candidate.both.knowledge=双印符文：两条讯线都传来「是」，它才放行；只要有一条是「否」，门就不动。旧门的锁纹正是照这条规矩刻的——天亮前，照它刻一道新术式。
candidate.single.name=残页丙 · 单席印
candidate.single.rule=恰好一份报告成立，门才开启；两份都成立反而不开。
candidate.single.origin=洛在登记台抽屉里找到，盖着档案馆旧章。
candidate.single.doubt=登记台也用这枚旧章——它说的可能是别的门。
candidate.single.model=candidates/single.dig

# 检验处回信里的说法：{0} 是岗位名。无讯是「许可印什么也没收到」，不作「门不开」。
letter.subject=档案门的新术式
letter.input.1={0} 持钥印
letter.input.0={0} 未持钥印
letter.output.1=门开
letter.output.0=门不开
letter.output.silent=无讯

# 序幕：接住第二章的最后一页——信使芙把 B 的手书送进档案馆，信才在这里拆开。
# 其余序幕与尾声的句子沿用 chapter 3 的默认（AcademyCinematic.Script）。
prologue.text.1=天亮之前，芙把那封封了口的信送到了档案馆。

# 疑点：每页「说话人|一两句对白」。说话人：芙 / 微光 / 洛
brief.1=芙|巡夜记录写着：零点时岗位 A、B 都是「否」——两人都已撤离，档案门整夜没开过。
brief.2=芙|可岗位 B 托我送来一封手书：零点整，B 在岗，钥印在手。记录和手书，总有一边错了。
brief.3=微光|手书只是一个人的说法，记录也可能写错。先别急着判谁说了谎。
brief.3.pose=举翼
brief.4=洛|要判断，得先知道这扇门的规矩。《门规》被水浸了，我只找回三张互相矛盾的残页。
brief.5=洛|更糟的是，门的校准页不见了。没有它，锁纹天亮前就会熄灭——得照真正的规矩刻一道新术式。
brief.6=微光|旧门还会如实回应。我们一页一页看残页，再去门前试讯台求证。
brief.6.pose=侧飞

# 线索：只有本轮当前术式真正通过可信检验后才开放
clue.1=洛|新术式通过了。刻纹时，我在门框夹层里摸到一页撕下的纸——正是失踪的校准页。
clue.2=微光|校准页上，零点那一格烙着一道光痕：门在零点开过一次。
clue.2.pose=好奇
clue.3=微光|我们刚亲眼证实：两份报告都成立，门才会开。所以零点那一刻，A 和 B 都持有钥印。
clue.3.pose=欢喜
clue.4=洛|可巡夜记录把两人都写成「否」。我翻了底稿——那两栏原本写的是「尚未收到报告」。
clue.5=芙|通往记录台的讯线那晚一直没亮，B 才托我送信。报告不是不成立，是根本没送到。
clue.6=微光|没收到，不等于不成立。有人把「无讯」填成了「否」，记录看起来完整，却不诚实。
clue.6.pose=专注
clue.7=洛|是谁填的、谁撕下校准页、讯线为什么不亮——现在都没有证据。已知和未知，我分开记下。
clue.8=芙|还有一件事：登记台那晚，同一个席位登记了两个人。下一封信，我先送去那里。
