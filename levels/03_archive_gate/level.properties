# LevelDefinition: 03 双人档案门（P1 垂直原型）
# 编码 UTF-8；加载时用 Properties.load(Reader, UTF_8)，不要用 load(InputStream)（ISO-8859-1）。
# 语义见 DESIGN_SPEC.md §2 与 §4/03。
schemaVersion=1
id=03_archive_gate
title=档案门：遗失的规则
story=旧档案门的开启规则遗失了。两个岗位各报告自己是否持有钥印；改变报告、观察门的回应，找回真正的规则。

# 端口：角色 ID = Digital 元件 Label；位宽均为 1
inputs=A,B
input.A.label=岗位 A
input.B.label=岗位 B
outputs=PERMIT
output.PERMIT.label=门开

# 资源（相对本文件目录）
reference=reference.dig
template=template.dig
# 可信测试来源：关卡资源，不使用玩家电路内的 Testcase
tests=tests.dig

# 结构检查：允许的 Digital elementName（Wire 不是元件，始终允许）
allowed=In,Out,And
# 每个角色端口必须恰好出现一次
requirePortsExactlyOnce=true

# 场景绑定：PERMIT=1 -> 门开；PERMIT=0 -> 门关；无效（高阻/未连接/错误）-> 故障态，不当作 0
scene=archive_door
scene.binding=PERMIT->open

hint.1=只改变一个岗位的报告，能让门打开吗？
hint.2=门打开时，两个岗位分别处于什么状态？
hint.3=两份讯息要送进同一个符文装置，再连到门的开关。
