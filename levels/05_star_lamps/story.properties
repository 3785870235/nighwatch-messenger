# 第五章：星灯归位。编码 UTF-8，加载时用 Properties.load(Reader, UTF_8)。
# 人物、残页与对白均为本项目原创，口径见 docs/WORLD_BIBLE.md「第五章」。候选残页的预测由 candidates/*.dig
# 交给 Digital 仿真得出，不在界面里另写逻辑表达式；排除只依据玩家亲眼观察到的旧灯回应。
# 两盏灯一起回答：读数 = 高星灯·2 + 低星灯（0 都暗，1 只亮低，2 只亮高，3 两盏都亮），按读数取 word.*.N。
# 本章只证实「星灯计数的规矩」和「零点那一刻亮的是高星灯、在岗的是两个人」；
# 不下谁写的日志、为什么那样写的结论。
schemaVersion=1

# 三张互不等价的候选残页（前台只用自然语言与原创符文名）。
# origin / doubt 是每页的来历与疑点：分量相当，不能靠来历猜出答案，只能靠塔前证据。
# 证据语义：00、10 分不出任何残页；01 推翻乙；11 同时推翻甲和乙。
candidates=count,station,carry
candidate.count.name=残页甲 · 几人几盏
candidate.count.rule=有几个岗位持钥印，就亮几盏：一个人亮低星灯，两个人两盏都亮。
candidate.count.origin=塔楼日志一直这样读灯：往前翻好几页，都是亮一盏记一人、亮两盏记两人。
candidate.count.doubt=日志是值夜人的手记，不是《塔规》原文；而且从来没写过亮的是哪一盏。
candidate.count.model=candidates/thermometer.dig
candidate.station.name=残页乙 · 一岗一灯
candidate.station.rule=一个岗位管一盏灯：岗位 A 持钥印，低星灯亮；岗位 B 持钥印，高星灯亮。
candidate.station.origin=塔里两根铜讯管看得清清楚楚：岗位 A 那根挨着低星灯，岗位 B 那根挨着高星灯。
candidate.station.doubt=两根讯管都先钻进同一个封盒；出了封盒各接哪一盏，从外面看不见。
candidate.station.model=candidates/per_station.dig
candidate.carry.name=残页丙 · 低星让位
candidate.carry.rule=恰好一个岗位持钥印，只亮低星灯；两个都持钥印，低星灯让位，只亮高星灯——高星灯一盏，记两个人。
candidate.carry.origin=洛在塔基拓下来的建塔铭文，石头上的字一笔一画都还在。
candidate.carry.doubt=拓片缺了一角，「高」字只拓出半边，也可能是别的字。
candidate.carry.model=candidates/binary.dig
candidate.carry.knowledge=两盏星灯各有一枚符文：两条讯线说法不同时，单席符文点亮低星灯；两条都是「是」，双印符文点亮高星灯，单席符文不放行，低星灯就让位。高星灯一盏，记两个人。照它给两盏星灯各重刻一道术式。

# 检验处回信里的说法：{0} 是岗位名。试讯单每一行前面写灯名，例如「高星灯 亮」。
# 无讯是「许可印什么也没收到」，不作「不亮」。
letter.subject=星灯的术式
letter.input.1={0} 持钥印
letter.input.0={0} 未持钥印
letter.output.1=亮
letter.output.0=不亮
letter.output.silent=无讯
letter.keeps=封盒里的旧术式失效之前，两道新的已经刻好了。

# 序幕与重刻之后的过场（AcademyCinematic.Script）
prologue.header=第五章 · 星灯归位
prologue.title.1=校准塔
prologue.text.1=天快亮了。芙爬上档案馆后面的校准塔，塔顶挂着两盏星灯，一盏高，一盏低。
prologue.title.2=塔楼日志
prologue.text.2=墙上的塔楼日志，零点那一格写着：「亮了一盏，记 一人在岗」。
prologue.title.3=一盏灯
prologue.text.3=可档案门前已经证实，零点那一刻 A、B 都持有钥印。微光停在灯旁：「一盏」说的是几个人？
prologue.title.4=向旧灯求证
prologue.text.4=星灯仍会回应。你选怎样的报告，来问出星灯计数真正的规矩？
epilogue.header=重刻之后
epilogue.title=一盏灯，两个人
epilogue.text.1=新刻的星灯通过了全部检验：两个岗位都持钥印时，低星灯让位，只亮高星灯。
epilogue.text.2=可塔楼日志那一格，写的是「一人在岗」。

# 疑点：每页「说话人|一两句对白」。说话人：芙 / 微光 / 洛
# 姿势：可选的 brief.N.pose / clue.N.pose 按台词意思选图，名字表在 AcademyCharacters.NAMED_POSES。
#   芙：持信 读信 递信 摊手 关切 回头 按信 出发；洛：抱书 翻书 端详 递页 背手 扶镜 回避 讲解
#   灯章里芙不用「读信」；洛不用「回避」——没有证据说他在藏东西。
brief.1=芙|这是校准塔。两个岗位的报告最后都送到这里，由两盏星灯数出来：今夜到底几个人在岗。
brief.1.pose=摊手
brief.2=洛|塔楼日志零点那一格：「亮了一盏，记 一人在岗」。哪一盏亮了，日志没写。
brief.2.pose=翻书
brief.3=芙|可我们在档案门前已经证实，零点那一刻 A、B 都持有钥印。两个人……怎么只记了一个？
brief.3.pose=关切
brief.4=微光|一盏灯记几个人，要看星灯怎么数。没有亲眼看过，「一人在岗」也只是一种说法。
brief.4.pose=好奇
brief.5=洛|《塔规》也残了，我只找到三张说法不同的残页。封盒里的旧术式也裂了，天亮前得照真规矩，给两盏星灯各刻一道新的。
brief.5.pose=背手
brief.6=微光|老规矩：一页一页看，再去塔前求证。两盏灯都要看清——亮的是哪一盏，暗的是哪一盏。
brief.6.pose=张翼

# 线索：只有本轮当前术式真正通过可信检验后才开放。最后几页把五章的证据排成一条报告链，已知和未知分开说。
clue.1=微光|我们刚亲眼证实：恰好一个岗位持钥印，只亮低星灯；两个都持钥印，低星灯让位，只亮高星灯。
clue.1.pose=欢喜
clue.2=洛|所以「亮了一盏」可能是一个人，也可能是两个人——得看亮的是哪一盏。日志偏偏没写。
clue.2.pose=讲解
clue.3=微光|日志里「亮了一盏」是看见的，「一人在岗」是推出来的。推的那一步，把「一盏」直接当成了「一个人」。
clue.3.pose=专注
clue.4=芙|那就把三处放在一起：登记台盖了「未受理」，是没人来，或者两个人一起来；星灯亮了一盏，是一个人，或者两个人。
clue.4.pose=摊手
clue.5=微光|两处能同时说通的，只有「两个人」。档案门的光痕也是这么说的——三处记录，各凭各的规矩，指向同一个答案。
clue.5.pose=举翼
clue.6=洛|我把这一夜从头排一遍。已知：零点 A、B 都持钥印；档案门开过一次；登记台没有受理；星灯亮的是高的那盏。
clue.6.pose=扶镜
clue.7=芙|还有：值房的报告灯、我那儿的提醒灯，零点以后一盏都没亮。A、B 既然都持钥印，那只能是讯线没把报告送到——记录台那边也一样。
clue.7.pose=按信
clue.8=微光|未知：讯线为什么暗；谁把「尚未收到」改成「否」、谁撕下校准页、谁并了登记那一行、谁补的「已停用」；日志为什么只写了一半。没有证据的，就留在未知那一栏。
clue.8.pose=困惑
clue.9=洛|记录完整，不等于事实完整。这一回，我把「不知道」也写进记录里。
clue.9.pose=端详
clue.10=芙|B 的手书说「零点整，在岗，钥印在手」——现在不只是一封信这么说了。天亮了，我把这一夜的记录送回档案馆。
clue.10.pose=出发

