# LevelDefinition: 05 星灯（第五章 · 星灯归位）
# 编码 UTF-8；加载时用 Properties.load(Reader, UTF_8)，不要用 load(InputStream)（ISO-8859-1）。
# 语义见 DESIGN_SPEC.md §05 星灯归位；故事口径见 docs/WORLD_BIBLE.md「第五章」。
schemaVersion=1
id=05_star_lamps
title=星灯：一盏灯，几个人
story=塔楼日志零点那一格写着「亮了一盏，记 一人在岗」。改变两个岗位的报告、观察两盏星灯的回应，找回星灯计数真正的规矩。

# 端口：角色 ID = Digital 元件 Label；位宽均为 1
inputs=A,B
input.A.label=岗位 A
input.B.label=岗位 B
# 两盏灯一起回答：第一个输出是读数的高位（C=高星灯记 2，S=低星灯记 1）
outputs=C,S
output.C.label=高星灯
output.S.label=低星灯

# 资源（相对本文件目录）
reference=reference.dig
template=template.dig
tests=tests.dig

# 结构检查：允许的 Digital elementName（Wire 不是元件，始终允许）。
# 任一印符文只是干扰项：拿它管低星灯，两个人时两盏都会亮，可信检验会如实退回。
allowed=In,Out,XOr,And,Or
# 每个角色端口必须恰好出现一次
requirePortsExactlyOnce=true

# 场景绑定：C=1 -> 高星灯亮；S=1 -> 低星灯亮；两盏各自独立；
# 无效（无讯/未连接/错误）-> 故障态，不当作两盏都暗
scene=star_tower
scene.binding=C->high,S->low
# 试讯台上两盏灯共用一块铜牌，灯下各有自己的小牌
scene.plate=校准塔 · 星灯

# 修复阶段：两盏灯各一枚符文，按输出顺序：双印符文管高星灯，单席符文管低星灯
repair.rune=And,XOr
repair.runeName=双印符文,单席符文
repair.rule=恰好一个岗位持钥印，只亮低星灯；两个都持钥印，低星灯让位，只亮高星灯——高星灯一盏就记两个人。双印符文管高星灯，单席符文管低星灯。
repair.check=去校准塔前看：一个人时只亮低星灯，两个人时只亮高星灯

hint.1=只改变一个岗位的报告，亮的是哪一盏？两个岗位都持钥印时呢？
hint.2=对照工作记录：两个岗位都持钥印的那一行，低星灯亮了没有？高星灯呢？
hint.3=两盏灯各要一枚符文：两份讯息都送进双印符文，接到高星灯；也都送进单席符文，接到低星灯。
