# 第四章：单席登记台。编码 UTF-8，加载时用 Properties.load(Reader, UTF_8)。
# 人物、残页与对白均为本项目原创，口径见 docs/WORLD_BIBLE.md「第四章」。候选残页的预测由 candidates/*.dig
# 交给 Digital 仿真得出，不在界面里另写逻辑表达式；排除只依据玩家亲眼观察到的旧灯回应。
# 本章只证实「单席登记的规矩」和「零点那一行是被并成『正常』的」；
# 不下谁改了记录、为什么改的结论。两个都持钥印时灯暗，是「这一轮不受理」，不是钥印没了。
schemaVersion=1

# 三张互不等价的候选残页（前台只用自然语言与原创符文名）。
# origin / doubt 是每页的来历与疑点：分量相当，不能靠来历猜出答案，只能靠灯前证据。
# 证据语义：00 分不出任何残页；01 或 10 推翻乙；11 同时推翻甲和乙。
candidates=any,both,single
candidate.any.name=残页甲 · 有人来领就受理
candidate.any.rule=只要有一个岗位持钥印来领，受理灯就亮。
candidate.any.origin=刻在登记台那块《登记须知》铜牌上，字口清楚。
candidate.any.doubt=铜牌角上还有一行小字，被铜锈盖住了，读不出来。
candidate.any.model=candidates/any.dig
candidate.both.name=残页乙 · 两人联签
candidate.both.rule=两个岗位都持钥印来领，受理灯才亮；只来一个，不受理。
candidate.both.origin=就是那晚的登记册：零点那一行并排签着 A、B，旁注「正常」。
candidate.both.doubt=旁注的笔迹，和登记册别的页都不一样。
candidate.both.model=candidates/both.dig
candidate.single.name=残页丙 · 单席印
candidate.single.rule=恰好一个岗位持钥印，受理灯才亮；两个一起来，这一轮谁也不受理。
candidate.single.origin=档案门前划掉的那一张——洛当初就是在登记台的抽屉里找到它的。
candidate.single.doubt=在档案门前，它已经被证据推翻过一次。
candidate.single.model=candidates/single.dig
candidate.single.knowledge=单席符文：两条讯线说法不同时，它才放行；两条都是「是」，或者都是「否」，受理灯就暗着。一个席位只能记给一个人——两个岗位一起来，不是钥印没了，是这一轮不受理。照它把受理灯的旧术式重刻一道。

# 检验处回信里的说法：{0} 是岗位名。无讯是「许可印什么也没收到」，不作「不受理」。
letter.subject=受理灯的术式
letter.input.1={0} 持钥印
letter.input.0={0} 未持钥印
letter.output.1=受理
letter.output.0=不受理
letter.output.silent=无讯
letter.keeps=受理灯底座的旧术式失效之前，新的已经刻好了。

# 序幕与重刻之后的过场（AcademyCinematic.Script）
prologue.header=第四章 · 单席登记台
prologue.title.1=登记台
prologue.text.1=芙来到档案馆前厅的登记台。守门席每夜只有一个，谁来值守，先在这里登记。
prologue.title.2=同一个席位
prologue.text.2=登记册零点那一行，并排签着 A、B 两个名字，旁边注着「正常」。
prologue.title.3=受理灯
prologue.text.3=台上的受理灯回答每一轮登记。微光停在灯旁：「正常」两个字，也只是一种说法。
prologue.title.4=向旧灯求证
prologue.text.4=受理灯仍会回应。你选怎样的报告，来问出单席登记真正的规矩？
epilogue.header=重刻之后
epilogue.title=两个名字，一个席位
epilogue.text.1=新刻的受理灯通过了全部检验：两个岗位一起来，这一轮谁也不受理。
epilogue.text.2=可登记册上那一行，写的是「正常」。受理灯底座里，还卡着一张存根。

# 疑点：每页「说话人|一两句对白」。说话人：芙 / 微光 / 洛
# 姿势：可选的 brief.N.pose / clue.N.pose 按台词意思选图，名字表在 AcademyCharacters.NAMED_POSES。
#   芙：持信 读信 递信 摊手 关切 回头 按信 出发；洛：抱书 翻书 端详 递页 背手 扶镜 回避 讲解
#   灯章里芙不用「读信」；洛不用「回避」——没有证据说他在藏东西。
brief.1=芙|这是档案馆前厅的登记台。守门席每夜只有一个，谁来值守，先在这里登记。
brief.1.pose=摊手
brief.2=洛|登记册零点那一行：同一个守门席，并排签着 A、B 两个名字，旁注「正常」。
brief.2.pose=翻书
brief.3=芙|在档案门前我们已经证实，零点那一刻 A、B 都持有钥印。两个人一起来领同一个席位……
brief.3.pose=关切
brief.4=微光|两份报告一起到，登记台会怎么回应？没有亲眼看过，「正常」两个字也只是一种说法。
brief.4.pose=好奇
brief.5=洛|《席规》也残了，我只找到三张说法不同的残页。受理灯底座的旧术式还裂了一道缝，天亮前得照真规矩刻一道新的。
brief.5.pose=背手
brief.6=微光|老规矩：一页一页看，再去登记台前求证。只有亲眼看到的，才算证据。
brief.6.pose=张翼

# 线索：只有本轮当前术式真正通过可信检验后才开放
clue.1=微光|我们刚亲眼证实：恰好一个岗位持钥印，受理灯才亮；两个都持钥印，这一轮谁也不受理。
clue.1.pose=欢喜
clue.2=洛|不受理，不是钥印没了。两枚钥印都还在——只是一个席位，不能同时记给两个人。
clue.2.pose=讲解
clue.3=芙|那零点那一轮，受理灯应该是暗的。可登记册上两个名字都签了，还写着「正常」。
clue.3.pose=摊手
clue.4=洛|刻纹时，我在受理灯底座里摸到零点那一轮的存根：盖的是「未受理」。
clue.4.pose=端详
clue.5=微光|有人把两个人的登记并成一行，把「未受理」写成了「正常」。和「尚未收到」被写成「否」一样：记录看起来完整，却不诚实。
clue.5.pose=偷看
clue.6=洛|是谁并的这一行、为什么要这样写——现在没有证据。我记在未知那一栏。
clue.6.pose=扶镜
clue.7=芙|还剩最后一处：校准塔的星灯，它要把每一份报告如实数出来。我们把这一夜，从头送一遍。
clue.7.pose=出发

