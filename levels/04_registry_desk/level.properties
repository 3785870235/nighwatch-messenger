# LevelDefinition: 04 受理灯（第四章 · 单席登记台）
# 编码 UTF-8；加载时用 Properties.load(Reader, UTF_8)，不要用 load(InputStream)（ISO-8859-1）。
# 语义见 DESIGN_SPEC.md §4 单席登记台；故事口径见 docs/WORLD_BIBLE.md「第四章」。
schemaVersion=1
id=04_registry_desk
title=受理灯：同一个席位
story=登记册零点那一行，同一个守门席签着两个名字，旁注「正常」。改变两个岗位的报告、观察受理灯的回应，找回单席登记真正的规矩。

# 端口：角色 ID = Digital 元件 Label；位宽均为 1
inputs=A,B
input.A.label=岗位 A
input.B.label=岗位 B
outputs=ACCEPT
output.ACCEPT.label=受理灯

# 资源（相对本文件目录）
reference=reference.dig
template=template.dig
tests=tests.dig

# 结构检查：允许的 Digital elementName（Wire 不是元件，始终允许）。
# 双印、任一印两种符文只是干扰项：只用它们拼不出「恰好一份」，可信检验会如实退回。
allowed=In,Out,XOr,And,Or
# 每个角色端口必须恰好出现一次
requirePortsExactlyOnce=true

# 场景绑定：ACCEPT=1 -> 受理灯亮；ACCEPT=0 -> 灯暗（本轮不受理，不表示钥印消失）；
# 无效（无讯/未连接/错误）-> 故障态，不当作 0
scene=registry_desk
scene.binding=ACCEPT->lit
# 试讯台上灯下那块铜牌；两个岗位共用一盏灯，所以不写岗位名
scene.plate=登记台 · 受理灯

# 修复阶段：两条讯线一起送进单席符文，再接到受理灯的许可印
repair.rune=XOr
repair.runeName=单席符文
repair.rule=恰好一个岗位持钥印时，受理灯才亮；两个都持钥印，这一轮谁也不受理。单席符文只在两份报告说法不同时放行。
repair.check=去登记台前看它是否只在恰好一个岗位持钥印时亮起

hint.1=只改变一个岗位的报告，灯会怎样？两个岗位都持钥印时呢？
hint.2=对照工作记录：两个岗位都持钥印的那一行，受理灯亮了没有？
hint.3=两份讯息要送进同一个单席符文，再连到受理灯的许可印上。
