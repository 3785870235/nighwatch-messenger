# 第一章：值房的灯。编码 UTF-8，加载时用 Properties.load(Reader, UTF_8)。
# 人物、残页与对白均为本项目原创，口径见 docs/WORLD_BIBLE.md「第一章」。候选残页的预测由 candidates/*.dig
# 交给 Digital 仿真得出，不在界面里另写逻辑表达式；排除只依据玩家亲眼观察到的旧灯回应。
# 本文件与 level.properties / reference / tests 分开，不参与旧进度指纹，旧存档继续可用。
# 本章只证实「报告灯的规矩」，也证实「灯暗不等于否」；不下 A、B 在不在岗的结论（第二、三章才逐步查清）。
schemaVersion=1

# 三张互不等价的候选残页（前台只用自然语言与原创符文名）。
# origin / doubt 是每页的来历与疑点：分量相当，不能靠来历猜出答案，只能靠灯前证据。
candidates=jia,yi,bing
candidate.jia.name=残页甲 · 照报告亮
candidate.jia.rule=岗位持有钥印，灯就亮起；未持钥印，灯就暗着。
candidate.jia.origin=夹在值房交接簿里，是上一任值夜人的笔迹。
candidate.jia.doubt=上一任值夜人才来了一个月，自己也常记错。
candidate.jia.model=candidates/jia.dig
candidate.jia.knowledge=报告灯的规矩：岗位持有钥印时，讯线传来「是」，灯就亮起；岗位未持钥印时，讯线传来「否」，灯就暗着。讯线直接接到许可印，不用经过任何符文——照它把 A 那盏重刻一道。
candidate.yi.name=残页乙 · 反着亮
candidate.yi.rule=岗位未持钥印，灯才亮起。
candidate.yi.origin=从《灯规》的书脊里抖出来，边角有水渍。
candidate.yi.doubt=残页上没写灯名——它说的也许是另一盏灯。
candidate.yi.model=candidates/yi.dig
candidate.bing.name=残页丙 · 讯线接着就亮
candidate.bing.rule=只要讯线接上，灯就一直亮着，不管报告说什么。
candidate.bing.origin=钉在值房门背后，下半页被撕掉了。
candidate.bing.doubt=撕掉的那半页上，也许还写着别的条件。
candidate.bing.model=candidates/bing.dig

# 检验处回信里的说法：{0} 是岗位名。无讯是「许可印什么也没收到」，不作「灯暗」。
letter.subject=报告灯的术式
letter.input.1={0} 持钥印
letter.input.0={0} 未持钥印
letter.output.1=灯亮
letter.output.0=灯暗
letter.output.silent=无讯
# 通过时回信的最后半句；锁纹只属于档案门，灯章说的是灯座上那道旧术式
letter.keeps=褪了色的旧术式失效之前，新的已经刻好了。

# 序幕与重刻之后的过场（AcademyCinematic.Script）
prologue.header=第一章 · 值房的灯
prologue.title.1=零点之后
prologue.text.1=零点钟声刚落，巡夜信使芙揣着一封封了口的信，走进值房。
prologue.title.2=两盏暗灯
prologue.text.2=值房墙上，岗位 A、B 的报告灯一盏也没有亮。
prologue.title.3=先听见，再相信
prologue.text.3=微光停在灯板旁：规矩丢了，灯还在。我们亲自去问它。
prologue.title.4=向旧灯求证
prologue.text.4=旧灯仍会回应。你选怎样的报告，来问出它真正的规矩？
epilogue.header=重刻之后
epilogue.title=灯的规矩
epilogue.text.1=新刻的报告灯通过了全部检验：规矩终于与术式一致。
epilogue.text.2=规矩证实了，灯却仍然暗着。已经知道的，与仍不知道的，都要如实写下。

# 疑点：每页「说话人|一两句对白」。说话人：芙 / 微光 / 洛
# 姿势：可选的 brief.N.pose / clue.N.pose 按台词意思选图，名字表在 AcademyCharacters.NAMED_POSES。
#   芙：持信 读信 递信 摊手 关切 回头 按信 出发；洛：抱书 翻书 端详 递页 背手 扶镜 回避 讲解
#   灯章里信还封着，芙不用「读信」；洛不用「回避」——没有证据说他在藏东西。
brief.1=芙|新来的值夜学徒？零点钟响过以后，值房墙上 A、B 两盏报告灯就一直暗着。
brief.1.pose=摊手
brief.2=芙|我巡到岗位 B 的信筒，里面有一封封了口的信，写明送档案馆。岗位 A 那边，什么消息也没有。
brief.2.pose=持信
brief.3=芙|信我不能拆。可灯暗着，到底在说什么？
brief.3.pose=关切
brief.4=洛|值房的《灯规》归档案馆管。报告灯那一页不见了，我只找到三张说法不同的残页。
brief.4.pose=端详
brief.5=洛|两盏灯的旧术式也都褪了色，迟早失效。每盏灯只听一个岗位的讯线——先照真规矩把 A 那盏重刻一道。
brief.5.pose=讲解
brief.6=微光|旧灯现在还会如实回应。灯下的试讯台接着 A 那盏：先一页一页看残页，再去求证。
brief.7=微光|记住：只有你亲眼看到的，才算证据。

# 线索：只有本轮当前术式真正通过可信检验后才开放
clue.1=洛|新术式通过了。A、B 两盏灯我都照它重刻，接回讯线——还是暗的。
clue.1.pose=翻书
clue.2=微光|我们刚亲眼证实：岗位持有钥印，讯线传来「是」，灯就亮；未持钥印，传来「否」，灯就暗。
clue.3=洛|术式没错，灯又暗着，那就清楚了：A 和 B 都是「否」。我这就记上。
clue.3.pose=讲解
clue.4=微光|先别记。灯只有收到「是」才会亮——讯线什么也没送来的时候，它一样亮不起来。
clue.5=芙|也就是说，灯暗可能是「否」，也可能是报告根本没送到这儿？
clue.5.pose=回头
clue.6=洛|……可值房的记录表只有「是」「否」两格，没有「没送到」这一格。
clue.6.pose=扶镜
clue.7=微光|那就先空着，在旁边写清楚：灯是暗的，为什么暗，还没有证据。灯的规矩证实了；A、B 在不在岗，还不知道。
clue.8=芙|讯线出了值房，先到我的信使站。那儿还有一排提醒灯——值夜人离岗时它会亮，我的铃也会跟着响。去那儿看看。
clue.8.pose=出发

