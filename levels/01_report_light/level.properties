# LevelDefinition: 01 报告灯（第一章 · 值房的灯）
# 编码 UTF-8；加载时用 Properties.load(Reader, UTF_8)，不要用 load(InputStream)（ISO-8859-1）。
# 故事口径见 docs/WORLD_BIBLE.md「第一章」。
schemaVersion=1
id=01_report_light
title=报告灯：暗着的两盏灯
story=零点以后，值房的两盏报告灯一直暗着，《灯规》里报告灯那一页也不见了。改变岗位 A 的报告、观察灯的回应，找回它真正的规矩。

# 端口：角色 ID = Digital 元件 Label；位宽均为 1
inputs=A
input.A.label=岗位 A
outputs=LIGHT
output.LIGHT.label=报告灯

# 资源（相对本文件目录）
reference=reference.dig
template=template.dig
tests=tests.dig

# 结构检查：允许的 Digital elementName（Wire 不是元件，始终允许）
allowed=In,Out
# 每个角色端口必须恰好出现一次
requirePortsExactlyOnce=true

# 场景绑定：LIGHT=1 -> 灯亮；LIGHT=0 -> 灯暗；无效（无讯/未连接/错误）-> 故障态，不当作 0
scene=report_light
scene.binding=LIGHT->lit

# 修复阶段：本章不需要符文，讯线直接接到许可印
repair.rune=
repair.runeName=
repair.rule=岗位持有钥印时，报告灯就亮；未持钥印时，灯就暗。讯线不用经过任何符文，直接接到许可印。
repair.check=去灯前看它是否只在岗位持钥印时亮起

hint.1=只有一个岗位，就只有两种报告：持钥印、未持钥印。两种都看一次。
hint.2=对照工作记录：灯亮的那一行，岗位 A 是什么状态？
hint.3=岗位 A 的讯线不需要经过任何符文，直接接到报告灯的许可印上。
