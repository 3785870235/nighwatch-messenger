# 第二章：不响的铃。编码 UTF-8，加载时用 Properties.load(Reader, UTF_8)。
# 人物、残页与对白均为本项目原创，口径见 docs/WORLD_BIBLE.md「第二章」。候选残页的预测由 candidates/*.dig
# 交给 Digital 仿真得出，不在界面里另写逻辑表达式；排除只依据玩家亲眼观察到的旧灯回应。
# 本文件与 level.properties / reference / tests 分开，不参与旧进度指纹，旧存档继续可用。
# 本章只证实「提醒灯的规矩」与「登记册那一条是后补的」；不下 A 在不在岗的结论，
# 只得出两盏灯合起来能支持的那一句：零点以后，讯线没有把报告送到信使站。
schemaVersion=1

# 三张互不等价的候选残页（前台只用自然语言与原创符文名）。
# origin / doubt 是每页的来历与疑点：分量相当，不能靠来历猜出答案，只能靠灯前证据。
candidates=jia,yi,bing
candidate.jia.name=残页甲 · 缺印就亮
candidate.jia.rule=岗位未持钥印，灯就亮起。
candidate.jia.origin=夹在巡夜手册的提醒灯那一页，字迹工整。
candidate.jia.doubt=手册是发给新生的简本，有些规矩写得省，不一定写全。
candidate.jia.model=candidates/jia.dig
candidate.jia.knowledge=提醒灯的规矩：岗位未持钥印时，讯线传来「否」，灯就亮起；岗位持有钥印时，讯线传来「是」，灯就暗着。值夜人离岗时它亮起来提醒信使，讯线要先经过反相符文——照它把 A 那盏重刻一道。
candidate.yi.name=残页乙 · 持印就亮
candidate.yi.rule=岗位持有钥印，灯就亮起。
candidate.yi.origin=从芙的信袋里翻出来，纸角折过。
candidate.yi.doubt=芙说这张是她刚入职时发的，可她记不清写的是不是提醒灯。
candidate.yi.model=candidates/yi.dig
candidate.bing.name=残页丙 · 已停用
candidate.bing.rule=灯已经停用，不管报告说什么，都不会亮。
candidate.bing.origin=洛从《器物登记册》上抄下的一条：「提醒灯，已停用。」
candidate.bing.doubt=登记册别的条目都写着日期，只有这一条没有。
candidate.bing.model=candidates/bing.dig

# 检验处回信里的说法：{0} 是岗位名。无讯是「许可印什么也没收到」，不作「灯暗」。
letter.subject=提醒灯的术式
letter.input.1={0} 持钥印
letter.input.0={0} 未持钥印
letter.output.1=灯亮
letter.output.0=灯暗
letter.output.silent=无讯
# 通过时回信的最后半句；锁纹只属于档案门，灯章说的是灯座上那道旧术式
letter.keeps=裂了缝的旧术式失效之前，新的已经刻好了。

# 序幕与重刻之后的过场（AcademyCinematic.Script）
prologue.header=第二章 · 不响的铃
prologue.title.1=信使站
prologue.text.1=芙揣着那封信，回到自己的信使站。讯线出了值房，先经过这里。
prologue.title.2=整夜无声
prologue.text.2=提醒灯一亮，芙的铃就会响。可今晚，铃一次也没响过。
prologue.title.3=一句「已停用」
prologue.text.3=微光停在灯板旁：登记册上的一句话，也只是一种说法。
prologue.title.4=向旧灯求证
prologue.text.4=旧灯仍会回应。你选怎样的报告，来问出提醒灯真正的规矩？
epilogue.header=重刻之后
epilogue.title=它没有停用
epilogue.text.1=新刻的提醒灯通过了全部检验：它没有停用。
epilogue.text.2=可铃整夜没响。把两盏灯放在一起，才说得清这一夜。

# 疑点：每页「说话人|一两句对白」。说话人：芙 / 微光 / 洛
# 姿势：可选的 brief.N.pose / clue.N.pose 按台词意思选图，名字表在 AcademyCharacters.NAMED_POSES。
#   芙：持信 读信 递信 摊手 关切 回头 按信 出发；洛：抱书 翻书 端详 递页 背手 扶镜 回避 讲解
#   灯章里信还封着，芙不用「读信」；洛不用「回避」——没有证据说他在藏东西。
brief.1=芙|这是我的信使站。讯线出了值房，先到这块灯板，再送去记录台。提醒灯一亮，我的铃就响。
brief.1.pose=摊手
brief.2=芙|今晚铃一次也没响过。A、B 的提醒灯都暗着。
brief.2.pose=关切
brief.3=洛|《器物登记册》上写着：提醒灯，已停用。要是真停用了，它暗着什么也说明不了。
brief.3.pose=翻书
brief.4=微光|也可能它没停用，只是规矩和我们想的不一样。《灯规》提醒灯那页也不见了，只剩三张残页。
brief.4.pose=好奇
brief.5=洛|A 那盏灯座上的旧术式裂了一道缝，迟早失效。天亮前得照真规矩刻一道新的。
brief.5.pose=背手
brief.6=微光|老规矩：一页一页看，再去试讯台求证。只有亲眼看到的，才算证据。
brief.6.pose=张翼

# 线索：只有本轮当前术式真正通过可信检验后才开放
clue.1=微光|我们刚亲眼证实：岗位未持钥印，提醒灯就亮；持有钥印，灯就暗。它没有停用。
clue.1.pose=欢喜
clue.2=洛|可登记册上明明写着「已停用」……这一条的墨色，比整页都新。
clue.2.pose=讲解
clue.3=微光|有人在登记册上补过这一条。是谁、为什么，现在没有证据。
clue.3.pose=偷看
clue.4=芙|那我的铃整夜没响，是不是说明 A 一直在岗？
clue.4.pose=摊手
clue.5=微光|把两盏灯放在一起看。A 持钥印，值房的报告灯该亮；A 不持，这盏提醒灯该亮。讯线要是一路通到这里，总有一盏会亮。
clue.5.pose=专注
clue.6=芙|可零点以后，两盏都没亮过……
clue.6.pose=关切
clue.7=微光|所以 A 的报告没有送到这里。至于值房那盏——也许 A 真的离岗、它照实暗着，也许讯线在值房前就断了。
clue.7.pose=困惑
clue.8=微光|两盏灯合在一起，也说不出 A 在不在岗。但有一件事确定了：今晚的讯线出了毛病。
clue.8.pose=举翼
clue.9=洛|B 的两盏灯也一样，整夜都暗着。讯线为什么送不到，我查不出来。
clue.9.pose=扶镜
clue.10=芙|那就只能靠信了。B 托我送的手书是写给档案馆的，我不能拆——我们把它送去，和巡夜记录对一对。
clue.10.pose=按信

