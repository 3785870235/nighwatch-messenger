# LevelDefinition: 02 提醒灯（第二章 · 不响的铃）
# 编码 UTF-8；加载时用 Properties.load(Reader, UTF_8)，不要用 load(InputStream)（ISO-8859-1）。
# 故事口径见 docs/WORLD_BIBLE.md「第二章」。
schemaVersion=1
id=02_reminder_light
title=提醒灯：不响的铃
story=信使站的提醒灯整夜没亮，《器物登记册》却说它已停用。改变岗位 A 的报告、观察灯的回应，看看它到底守着什么规矩。

# 端口：角色 ID = Digital 元件 Label；位宽均为 1
inputs=A
input.A.label=岗位 A
outputs=REMIND
output.REMIND.label=提醒灯

# 资源（相对本文件目录）
reference=reference.dig
template=template.dig
tests=tests.dig

# 结构检查：允许的 Digital elementName（Wire 不是元件，始终允许）
allowed=In,Out,Not
# 每个角色端口必须恰好出现一次
requirePortsExactlyOnce=true

# 场景绑定：REMIND=1 -> 灯亮；REMIND=0 -> 灯暗；无效（无讯/未连接/错误）-> 故障态，不当作 0
scene=reminder_light
scene.binding=REMIND->lit

# 修复阶段：讯线先经过反相符文，再接到许可印
repair.rune=Not
repair.runeName=反相符文
repair.rule=岗位未持钥印时，提醒灯才亮；持有钥印时，灯就暗着。反相符文把传来的「是」变成「否」、「否」变成「是」。
repair.check=去灯前看它是否只在岗位未持钥印时亮起

hint.1=只有一个岗位，就只有两种报告：持钥印、未持钥印。两种都看一次。
hint.2=对照工作记录：提醒灯亮的那一行，岗位 A 是什么状态？
hint.3=讯息要先经过反相符文，再接到提醒灯的许可印上。
